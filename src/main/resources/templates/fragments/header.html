<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Logo" width="40" height="40" class="d-inline-block align-text-top"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="bi bi-building-fill-exclamation text-danger" style="display:none;"></i>
                <span>BnBillains</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:text="#{msg.header.home}">Inicio</a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/guaridas}" th:text="#{msg.header.lair}">Guaridas</a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/villanos}" th:text="#{msg.header.villains}">Villanos</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center gap-3">

                    <li class="nav-item d-flex align-items-center">
                        <a th:href="@{''(lang=es)}" class="nav-link p-1" title="Español">🇪🇸</a>
                        <span class="text-secondary">|</span>
                        <a th:href="@{''(lang=en)}" class="nav-link p-1" title="English">🇬🇧</a>
                    </li>

                    <li class="nav-item d-flex gap-2" th:unless="${#authorization.expression('isAuthenticated()')}">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3">
                            <i class="bi bi-person-fill"></i> <span th:text="#{spring.security.ui.login.submit}">Login</span>
                        </a>
                        <a th:href="@{/register}" class="btn btn-danger btn-sm px-3">
                            <i class="bi bi-person-plus-fill"></i> Registro
                        </a>
                    </li>

                    <li class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://github.com/mdo.png" alt="Avatar" width="32" height="32" class="rounded-circle border border-danger">
                            <span th:text="${#authentication.name}" class="text-white">Villano</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdown">
                            <li><span class="dropdown-header text-uppercase small">Tu Cuenta</span></li>
                            <li><a class="dropdown-item" href="#">Mi Perfil</a></li>
                            <li><a class="dropdown-item" href="#">Mis Reservas</a></li>
                            <li><hr class="dropdown-divider bg-secondary"></li>

                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger fw-bold d-flex align-items-center gap-2">
                                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</html>
