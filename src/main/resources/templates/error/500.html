<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head (#{msg.error.500.title} + ' - BnBillains')"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>
<main class="flex-shrink-0">
    <div class="container">
        <h1 th:text="${errorCode}">500</h1>
        <p class="lead" th:text="${errorMessage ?: #{msg.error.500.message}}">Ha ocurrido un error interno
            en el servidor.</p>
        <a href="/" class="btn btn-primary" th:text="#{msg.error.backHome}">Volver al inicio</a>
    </div>
</main>
<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
