<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head ('BnBillains - ' + #{msg.login.title})}"></head>
<body class="d-flex flex-column h-100">

<header th:replace="~{fragments/header :: header}"></header>

<main class="flex-shrink-0 flex-grow-1 d-flex justify-content-center align-items-center container"
      style="min-height: 100vh; padding-top: 120px; padding-bottom: 100px;">

    <div class="card shadow col-md-6 col-lg-4 border-secondary">

        <div class="card-header text-center">
            <h2 class="mb-0 display-6" th:text="#{msg.login.title}">
                Identificación
            </h2>
        </div>

        <div class="card-body p-4">

            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert"
                 style="background-color: #5a0000; color: #fff; border-color: #8a0000;">
                <i class="bi bi-radioactive"></i> <span th:text="#{msg.login.error}">Credenciales incorrectas.</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" th:aria-label="#{msg.common.close}"></button>
            </div>

            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert"
                 style="background-color: #1e4620; color: #fff; border-color: #2e7d32;">
                <i class="bi bi-door-closed"></i> <span th:text="#{msg.login.logoutSuccess}">Has huido correctamente.</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" th:aria-label="#{msg.common.close}"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="username" class="form-label text-light fw-bold" th:text="#{msg.login.username}">Usuario o Email:</label>
                        <input type="text" class="form-control" id="username" name="username"
                               th:placeholder="#{msg.login.usernamePlaceholder}" required autofocus>
                    </div>

                    <div class="col-12">
                        <label for="password" class="form-label text-light fw-bold" th:text="#{msg.login.password}">Contraseña:</label>
                        <input type="password" class="form-control" id="password" name="password"
                               th:placeholder="#{msg.login.passwordPlaceholder}" required>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg shadow" type="submit">
                                <i class="bi bi-fingerprint"></i> <span th:text="#{msg.login.submit}">ACCEDER</span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>

            <hr class="my-4" style="border-color: var(--color-logo-light); opacity: 0.5;">

            <div class="p-3 rounded mb-3" style="background-color: #121212; border: 1px solid #333;">
                <h6 class="text-center text-white text-uppercase small fw-bold mb-3" th:text="#{msg.login.useFakeIdentity}">O usa identidad falsa</h6>

                <div class="d-grid gap-2">

                    <a href="/oauth2/authorization/google" class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-google text-danger"></i>
                        <span class="fw-bold small">Google</span>
                    </a>

                    <a href="/oauth2/authorization/linkedin" class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-linkedin text-primary"></i>
                        <span class="small">LinkedIn</span>
                    </a>

                    <a href="/oauth2/authorization/gitlab" class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-gitlab" style="color: #FC6D26;"></i>
                        <span class="small">GitLab</span>
                    </a>

                </div>
            </div>

            <div class="text-center mt-3">
                <p class="small text-white mb-1" th:text="#{msg.login.noRecord}">¿Sin antecedentes?</p>
                <a href="/register" class="text-light fw-bold text-decoration-none hover-scale d-inline-block">
                    <span th:text="#{msg.login.registerHere}">RECLÚTATE AQUÍ</span> <i class="bi bi-arrow-right-short"></i>
                </a>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
